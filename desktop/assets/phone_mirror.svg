<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="phoneBodyMirror" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584E4"/>
      <stop offset="100%" stop-color="#1C71D8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241F31"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <filter id="shadowMirror" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Body -->
  <rect x="24" y="10" width="80" height="108" rx="16" ry="16" fill="url(#phoneBodyMirror)" filter="url(#shadowMirror)" stroke="#62A0EA" stroke-width="2"/>
  
  <!-- Inner Bezel -->
  <rect x="28" y="14" width="72" height="100" rx="12" ry="12" fill="#1E1E1E"/>
  
  <!-- Screen Area -->
  <rect x="30" y="18" width="68" height="92" rx="10" ry="10" fill="url(#screenGrad)"/>
  
  <!-- Camera punchhole -->
  <circle cx="64" cy="24" r="2" fill="#000000"/>
  
  <!-- Cast / Screen Mirror Display Icon in Center -->
  <path d="M42 42 h44 v30 h-44 z" fill="none" stroke="#62A0EA" stroke-width="3" rx="4"/>
  <!-- Broadcast Screen Waves -->
  <path d="M48 80 h32" stroke="#3584E4" stroke-width="3" stroke-linecap="round"/>
  <path d="M56 86 h16" stroke="#62A0EA" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="57" r="6" fill="#3584E4"/>
  <path d="M52 57 A 14 14 0 0 1 76 57" fill="none" stroke="#62A0EA" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 57 A 20 20 0 0 1 82 57" fill="none" stroke="#99C1F1" stroke-width="2" stroke-linecap="round"/>
</svg>

