<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="phoneBodyActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EC27E"/>
      <stop offset="100%" stop-color="#26A269"/>
    </linearGradient>
    <linearGradient id="phoneScreenActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2D23"/>
      <stop offset="100%" stop-color="#121F18"/>
    </linearGradient>
    <filter id="shadowActive" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Body -->
  <rect x="28" y="10" width="72" height="108" rx="16" ry="16" fill="url(#phoneBodyActive)" filter="url(#shadowActive)" stroke="#57E389" stroke-width="2"/>
  
  <!-- Inner Bezel -->
  <rect x="32" y="14" width="64" height="100" rx="12" ry="12" fill="#1E1E1E"/>
  
  <!-- Screen Area -->
  <rect x="34" y="18" width="60" height="92" rx="10" ry="10" fill="url(#phoneScreenActive)"/>
  
  <!-- Camera punchhole -->
  <circle cx="64" cy="24" r="2.5" fill="#000000"/>
  
  <!-- Home Indicator Bar -->
  <rect x="52" y="104" width="24" height="2.5" rx="1.25" ry="1.25" fill="#77767B"/>
  
  <!-- Screen Content: Checkmark / Connected State -->
  <circle cx="64" cy="62" r="16" fill="#2EC27E" fill-opacity="0.2"/>
  <path d="M55 62 L61 68 L73 54" fill="none" stroke="#57E389" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

